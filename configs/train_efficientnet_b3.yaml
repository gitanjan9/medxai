experiment:
  name: mimic_cxr_efficientnet_b3_384_multilabel
  seed: 42
  output_dir: artifacts/efficientnet_b3_384

data:
  mode: image
  task: multilabel
  train_path: artifacts/v3_disease_labels.csv
  val_path: null
  val_split: 0.15
  image_col: image
  image_size: [384, 384]
  num_workers: 0
  pin_memory: true

model:
  architecture: efficientnet_b3
  spatial_dims: 2
  in_channels: 1
  num_classes: 15
  pretrained: true
  dropout_rate: 0.35

training:
  epochs: 50
  batch_size: 16
  learning_rate: 3.0e-5
  weight_decay: 1.0e-4
  use_amp: true
  grad_clip_norm: 1.0
  class_balance_strategy: multilabel_bce_focal
  freeze_epochs: 5
  backbone_lr_scale: 0.1

early_stopping:
  enabled: true
  patience: 10
  monitor: val_auroc_macro
  mode: max
  min_delta: 1.0e-4

optimizer:
  name: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine_annealing
  T_max: 45
  eta_min: 1.0e-7

checkpoint:
  dir: artifacts/efficientnet_b3_384/checkpoints
  save_top_k: 3
  monitor: val_auroc_macro
  mode: max
  filename_template: "epoch={epoch:03d}_val_auroc_macro={val_auroc_macro:.4f}"

mlflow:
  tracking_uri: sqlite:///mlruns/mlflow.db
  experiment_name: mimic_cxr_efficientnet_b3_384
  run_name: null
  log_model_artifact: true
  artifact_path: model

bundle:
  name: mimic_cxr_classifier
  bundle_root: bundles/classifier_bundle
  version: "0.4.0"
